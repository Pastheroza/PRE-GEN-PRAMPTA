[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prampta"
version = "0.4.0"
description = "Python SDK for the PRAMPTA PRE-GEN verification API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "PRAMPTA" }]
keywords = ["prampta", "pre-gen", "ai", "verification", "generative-rights"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
async = ["httpx>=0.25"]

[project.urls]
Homepage = "https://github.com/Pastheroza/PRE-GEN-PRAMPTA"
Documentation = "https://github.com/Pastheroza/PRE-GEN-PRAMPTA/tree/SDK/python"
