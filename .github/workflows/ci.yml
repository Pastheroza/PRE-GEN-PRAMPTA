name: CI

on:
  push:
    branches: [SDK]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK + test deps
        run: |
          pip install -e ./python
          pip install pytest pytest-asyncio
      - name: Tests (incl. spec vectors)
        run: pytest -q python/tests

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build
        run: npm run build
      - name: Typecheck (src)
        run: npm run typecheck
      - name: Typecheck (examples — the quickstart must always compile)
        run: npm run typecheck:examples
      - name: Tests (incl. spec vectors)
        run: npm test
      - name: Package sanity
        run: npm pack --dry-run
